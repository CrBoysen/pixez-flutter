name: Build R18 Fork

# 定时检查上游是否发了新版；没发新 release 就直接退出，不浪费构建额度。
# 注意：GitHub 的 schedule 只在默认分支生效，所以本仓库默认分支必须是 custom。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '上游无新版也强制构建'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: r18-build
  cancel-in-progress: false

env:
  UPSTREAM: Notsfsssf/pixez-flutter

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
      upstream_tag: ${{ steps.probe.outputs.upstream_tag }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          UP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/releases/latest" | jq -r '.tag_name // empty')
          if [ -z "$UP" ]; then echo "::error::无法读取上游 release"; exit 1; fi
          echo "upstream_tag=$UP" >> "$GITHUB_OUTPUT"
          echo "上游最新 release: $UP"

          EXIST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg p "v$UP-r18" '[.[] | select(.tag_name | startswith($p))] | length')
          echo "本仓库已有的同版发布数: $EXIST"

          if [ "$FORCE" = "true" ] || [ "$EXIST" = "0" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "上游未发新版，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取出定制配方
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1

      - name: 备份配方并切到上游最新提交
        run: |
          set -euo pipefail
          git config user.name "fork-bot"
          git config user.email "fork-bot@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/recipe"
          cp -r fork "$RUNNER_TEMP/recipe/fork"

          # 直接在上游最新提交上构建，不做 merge —— 从根上消除冲突可能
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch upstream master --depth=1
          UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          git checkout -f FETCH_HEAD
          cp -r "$RUNNER_TEMP/recipe/fork" fork

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Rust 侧的 NDK 链接器靠这个变量找工具链
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 安装 Rust 交叉编译工具链
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 拉依赖
        run: |
          set -euo pipefail
          flutter pub get
          ( cd plugins/rhttp/rhttp && flutter pub get )

      - name: 生成代码（.g.dart / .freezed.dart 都被 gitignore，必须现生成）
        run: |
          set -euo pipefail
          # rhttp 插件内部的 freezed 文件是它自己的产物，不跟着根包一起生成，必须单独跑
          ( cd plugins/rhttp/rhttp && dart run build_runner build --delete-conflicting-outputs )
          dart run build_runner build --delete-conflicting-outputs

      - name: 注入定制代码
        run: node fork/apply.mjs

      - name: 静态检查定制代码
        run: dart analyze --no-fatal-warnings lib/custom/r18_only_feed.dart

      - name: 恢复签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: 构建 APK
        env:
          UP_TAG: ${{ needs.check.outputs.upstream_tag }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          CODE=$((20000000 + RUN_NO))
          NAME="${UP_TAG}-r18.${RUN_NO}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "构建 $NAME ($CODE)"
          flutter build apk --release --split-per-abi \
            --build-name="$NAME" --build-number="$CODE"

      - name: 生成修改说明（GPL 源码披露）
        run: |
          # 必须先把新文件也纳入索引，否则 lib/custom/ 这种新增文件不会出现在 diff 里
          git add -A
          git diff --cached > "$RUNNER_TEMP/applied.patch"
          echo "改动行数: $(wc -l < "$RUNNER_TEMP/applied.patch")"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ${{ env.VERSION_NAME }}
          make_latest: true
          body: |
            基于上游 `${{ needs.check.outputs.upstream_tag }}` 构建（commit `${{ env.UPSTREAM_SHA }}`）。

            **客户端个性化修改**：首页顶部的「推荐 / 仅 R-18」模式切换条。
            数据源为「你收藏作品的邻居」，不是全站榜单。

            修改内容见附件 `applied.patch`；配方见 `custom` 分支 `fork/`。
            本项目遵循 GPL-3.0，修改后源码同样公开。

            versionCode `${{ env.VERSION_CODE }}`（换签名，首次安装需卸载官方版）
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            ${{ runner.temp }}/applied.patch

      # 不再在这里 force push master 做镜像同步：
      # 前面是 --depth=1 的浅克隆，把浅提交强推到 master 会因为缺少父提交对象而失败，
      # 一次失败就会把「构建成功 + 已发版」的运行标记成红色，反而误导人。
      # master 保持为手动对齐的干净快照，构建永远直接用上游当次 SHA，不依赖它。
