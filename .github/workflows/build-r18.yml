name: Build PixEz R18 APK

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: Notsfsssf/pixez-flutter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: Notsfsssf/pixez-flutter
          fetch-depth: 1
          path: src

      - name: Patch R18 filter + updater endpoint
        working-directory: src
        run: |
          set -euo pipefail
          FILE=lib/network/api_client.dart
          BEFORE=$(grep -c 'recommended?filter=for_ios' "$FILE" || true)
          echo "found for_ios occurrences: $BEFORE"
          sed -i 's#/v1/illust/recommended?filter=for_ios#/v1/illust/recommended?filter=for_android#g; s#/v1/manga/recommended?filter=for_ios#/v1/manga/recommended?filter=for_android#g' "$FILE"
          if grep -q 'recommended?filter=for_ios' "$FILE"; then
            echo "::error::patch failed, upstream code changed"
            exit 1
          fi
          grep -n 'recommended?filter=for_android' "$FILE"

          SELF_REPO="${GITHUB_REPOSITORY}"
          sed -i "s#Notsfsssf/pixez-flutter#${SELF_REPO}#g" lib/er/updater.dart lib/page/about/update_page.dart || true
          echo "updater now points to: $(grep -ho "${SELF_REPO}" lib/er/updater.dart | head -1)"

          VER=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          echo "version = $VER"
          sed -i -E "s#(tagName[[:space:]]*=[[:space:]]*\")[0-9][^\"]*\"#\1${VER}\"#" lib/constants.dart || true
          grep -n 'tagName' lib/constants.dart | head -3 || true

          SHA=$(git rev-parse --short=7 HEAD)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Skip if this commit already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if echo "$BODY" | grep -q "$SHA"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "commit $SHA already released as $VERSION, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK / NDK
        if: steps.check.outputs.skip == 'false'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "ndk;28.2.13676358" > /dev/null

      - name: Setup Flutter
        if: steps.check.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing config
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::no keystore secrets found, will build debug apk"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "signing config ready"

      - name: Build APK
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          if [ -f android/key.properties ]; then
            flutter build apk --release --target-platform android-arm64
          else
            flutter build apk --debug --target-platform android-arm64
          fi
          find . -maxdepth 6 -name "*.apk" -print

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APKS=$(find src -maxdepth 6 -name "*.apk" | tr '\n' ' ')
          echo "apks: $APKS"
          [ -z "$APKS" ] && { echo "::error::no apk produced"; exit 1; }
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VERSION" $APKS \
            --repo "$GITHUB_REPOSITORY" \
            --title "PixEz $VERSION (R18)" \
            --notes "Upstream: ${UPSTREAM} @ ${SHA}
Recommend feed filter patched: for_ios -> for_android (R-18 visible)
Built automatically by GitHub Actions."
