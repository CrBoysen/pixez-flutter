name: Build PixEz R18 APK

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: Notsfsssf/pixez-flutter
  FLUTTER_VERSION: "3.47.9"
  R18_VERSION: "1.9.95+520"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: Notsfsssf/pixez-flutter
          fetch-depth: 1
          path: src

      - name: Patch R18 filter + updater endpoint + r18-only switch
        working-directory: src
        run: |
          set -euo pipefail
          FILE=lib/network/api_client.dart
          BEFORE=$(grep -c 'recommended?filter=for_ios' "$FILE" || true)
          echo "found for_ios occurrences: $BEFORE"
          sed -i 's#/v1/illust/recommended?filter=for_ios#/v1/illust/recommended?filter=for_android#g; s#/v1/manga/recommended?filter=for_ios#/v1/manga/recommended?filter=for_android#g' "$FILE"
          if grep -q 'recommended?filter=for_ios' "$FILE"; then
            echo "::error::patch failed, upstream code changed"
            exit 1
          fi
          grep -n 'recommended?filter=for_android' "$FILE"

          SELF_REPO="${GITHUB_REPOSITORY}"
          sed -i "s#Notsfsssf/pixez-flutter#${SELF_REPO}#g" lib/er/updater.dart lib/page/about/update_page.dart || true
          echo "updater now points to: $(grep -ho "${SELF_REPO}" lib/er/updater.dart | head -1)"

          echo "=== apply r18-only switch patch ==="
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/patches/r18-only-switch.patch" -o /tmp/r18-only-switch.patch
          git apply --check /tmp/r18-only-switch.patch
          git apply /tmp/r18-only-switch.patch
          git status --porcelain

          echo "=== pin version / tagName ==="
          sed -i -E "s#^version:.*#version: ${R18_VERSION}#" pubspec.yaml
          VER=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          echo "version = $VER"
          sed -i -E "s#(tagName[[:space:]]*=[[:space:]]*\")[0-9][^\"]*\"#\1${VER}\"#" lib/constants.dart || true
          grep -n 'tagName' lib/constants.dart | head -3 || true

          SHA=$(git rev-parse --short=7 HEAD)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Skip if this commit already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if echo "$BODY" | grep -q "$SHA"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "commit $SHA already released as $VERSION, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK / NDK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKM=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            find / -maxdepth 6 -name sdkmanager -type f 2>/dev/null | head -5 || true
            exit 1
          fi
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "ndk;28.2.13676358" > /dev/null || true
          "$SDKM" --install "platforms;android-37" > /dev/null 2>&1 \
            || "$SDKM" --install "platforms;android-37.0" > /dev/null 2>&1 || true
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi
          echo "--- platforms ---"; ls -1 "$SDK_ROOT/platforms" || true
          echo "--- ndk ---"; ls -1 "$SDK_ROOT/ndk" || true
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Flutter
        if: steps.check.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing config
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::no keystore secrets found, will build debug apk"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "signing config ready"

      - name: Build APK
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          grep -q 'android.builder.sdkDownload' android/gradle.properties 2>/dev/null \
            || echo "android.builder.sdkDownload=true" >> android/gradle.properties
          flutter pub get
          # rhttp is a path dependency: its codegen must be generated inside the plugin package first
          ( cd plugins/rhttp/rhttp && dart run build_runner build )
          dart run build_runner build
          if [ -f android/key.properties ]; then
            flutter build apk --release --target-platform android-arm64
          else
            flutter build apk --debug --target-platform android-arm64
          fi
          find . -maxdepth 6 -name "*.apk" -print

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist keep && mkdir -p dist keep
          add_apk() {
            b=$(basename "$1")
            [ -f "dist/$b" ] && return 0
            cp -f "$1" "dist/$b"
          }
          # prefer apk/release (universal + abi splits), fallback to flutter-apk, dedupe by basename
          if [ -d src/build/app/outputs/apk/release ]; then
            find src/build/app/outputs/apk/release -maxdepth 1 -name '*.apk' -print0 2>/dev/null \
              | while IFS= read -r -d '' f; do add_apk "$f"; done || true
          fi
          find src -maxdepth 6 -name '*.apk' -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do add_apk "$f"; done || true
          echo "== raw apks =="; ls -l dist
          # app-release.apk is the same universal build; use it as universal if the explicit one is missing
          if [ ! -f dist/app-universal-release.apk ] && [ -f dist/app-release.apk ]; then
            cp -f dist/app-release.apk dist/app-universal-release.apk
          fi
          # keep only: arm64-v8a, armeabi-v7a, x86_64, universal
          for b in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk app-universal-release.apk; do
            if [ -f "dist/$b" ]; then mv -f "dist/$b" "keep/$b"; else echo "::warning::$b not produced in this build"; fi
          done
          echo "== released apks =="; ls -l keep
          APKS=$(find keep -maxdepth 1 -name '*.apk' | sort | tr '\n' ' ')
          echo "apks: $APKS"
          [ -z "$APKS" ] && { echo "::error::no apk produced"; exit 1; }
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          gh release create "$VERSION" $APKS \
            --repo "$GITHUB_REPOSITORY" \
            --title "PixEz $VERSION (R18)" \
            --notes "上游代码：Notsfsssf/pixez-flutter @ ${SHA}
          版本：${VERSION}

          【更新说明】
          - 推荐流接口过滤参数由 for_ios 改为 for_android，首页与漫画推荐可见 R-18 作品
          - 首页顶部新增「仅 R-18」胶囊开关，开启后仅展示 R-18 内容，并自动补充 week_r18 榜单作品
          - 关闭开关时保持原版观感，数据与官方版本一致
          - 使用前提：pixiv 账号设置与 App 内设置均需开启显示 R18 内容

          【产物说明】
          仅提供 4 个安装包：app-arm64-v8a-release.apk（arm64 设备，推荐）、app-armeabi-v7a-release.apk（32 位 arm）、app-x86_64-release.apk（模拟器）、app-universal-release.apk（通用全架构）。

          【说明】
          本构建由 Marvis（AI 桌面助手）自动完成：同步上游代码 → 应用 r18-only-switch 补丁 → 编译签名 → 发布。
          本项目为个人自用 fork，仅用于学习与功能验证，请勿用于商业用途。"
